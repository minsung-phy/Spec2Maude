name: Emscripten failed dlopen poisoning analysis

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out analysis branch
        uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3"
          dune-cache: true

      - name: Install OCaml dependencies
        run: opam install dune menhir zarith -y

      - name: Build Spec2Maude and wasm2maude
        run: opam exec -- dune build --profile release

      - name: Install Maude 3.5.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://github.com/maude-lang/Maude/releases/download/Maude3.5.1/Maude-3.5.1-linux-x86_64.zip \
            -o "$RUNNER_TEMP/maude.zip"
          unzip -q "$RUNNER_TEMP/maude.zip" -d "$RUNNER_TEMP/maude"
          maude_bin=$(find "$RUNNER_TEMP/maude" -type f -name maude -perm -u+x | head -n 1)
          test -n "$maude_bin"
          echo "$(dirname "$maude_bin")" >> "$GITHUB_PATH"
          echo "MAUDE=$maude_bin" >> "$GITHUB_ENV"
          "$maude_bin" --version

      - name: Load Spec2Maude semantics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/emscripten-dlopen"
          "$MAUDE" -no-banner output.maude \
            > "$RUNNER_TEMP/emscripten-dlopen/output-load.log" 2>&1
          "$MAUDE" -no-banner builtins.maude \
            > "$RUNNER_TEMP/emscripten-dlopen/builtins-load.log" 2>&1
          if grep -Eq '^(Warning|Advisory|Error):' \
              "$RUNNER_TEMP/emscripten-dlopen/output-load.log" \
              "$RUNNER_TEMP/emscripten-dlopen/builtins-load.log"; then
            cat "$RUNNER_TEMP/emscripten-dlopen/output-load.log"
            cat "$RUNNER_TEMP/emscripten-dlopen/builtins-load.log"
            exit 1
          fi

      - name: Reproduce dynamic-loader violations
        shell: bash
        run: |
          set -euo pipefail
          bash benchmarks/emscripten-dlopen/run.sh "$RUNNER_TEMP/emscripten-dlopen"

      - name: Validate concrete Wasm modules through wasm2maude
        shell: bash
        run: |
          set -euo pipefail
          for module in libbad liblocal-provider liblocal-consumer; do
            opam exec -- dune exec --profile release ./bin/wasm2maude.exe -- module \
              "$RUNNER_TEMP/emscripten-dlopen/${module}.wasm" \
              --semantics builtins.maude \
              -o "$RUNNER_TEMP/emscripten-dlopen/${module}-typecheck.maude"
            "$MAUDE" -no-banner \
              "$RUNNER_TEMP/emscripten-dlopen/${module}-typecheck.maude" \
              > "$RUNNER_TEMP/emscripten-dlopen/${module}-typecheck.log" 2>&1
            grep -q 'result Bool: true' \
              "$RUNNER_TEMP/emscripten-dlopen/${module}-typecheck.log"
            if grep -Eq '^(Warning|Advisory|Error):' \
                "$RUNNER_TEMP/emscripten-dlopen/${module}-typecheck.log"; then
              cat "$RUNNER_TEMP/emscripten-dlopen/${module}-typecheck.log"
              exit 1
            fi
          done

      - name: Model check current and repaired loader protocols
        shell: bash
        run: |
          set -euo pipefail
          "$MAUDE" -no-banner \
            builtins.maude \
            benchmarks/emscripten-dlopen/loader-modelcheck.maude \
            > "$RUNNER_TEMP/emscripten-dlopen/loader-modelcheck.log" 2>&1

          test "$(grep -c '^Solution 1' "$RUNNER_TEMP/emscripten-dlopen/loader-modelcheck.log")" -eq 6
          test "$(grep -c '^No solution\.' "$RUNNER_TEMP/emscripten-dlopen/loader-modelcheck.log")" -eq 5
          test "$(grep -c 'result ModelCheckResult: counterexample' "$RUNNER_TEMP/emscripten-dlopen/loader-modelcheck.log")" -eq 5
          test "$(grep -c 'result Bool: true' "$RUNNER_TEMP/emscripten-dlopen/loader-modelcheck.log")" -eq 5

          if grep -Eq '^(Warning|Advisory|Error):' \
              "$RUNNER_TEMP/emscripten-dlopen/loader-modelcheck.log"; then
            cat "$RUNNER_TEMP/emscripten-dlopen/loader-modelcheck.log"
            exit 1
          fi

      - name: Collect runner metadata
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/emscripten-dlopen"
          {
            echo "github_sha=$GITHUB_SHA"
            echo "runner_os=$RUNNER_OS"
            docker --version || true
            opam exec -- ocaml -version || true
            opam exec -- dune --version || true
            if [[ -n "${MAUDE:-}" ]]; then "$MAUDE" --version || true; fi
          } > "$RUNNER_TEMP/emscripten-dlopen/environment.txt"

      - name: Upload reproduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emscripten-failed-dlopen
          path: ${{ runner.temp }}/emscripten-dlopen
          if-no-files-found: warn
          retention-days: 14
