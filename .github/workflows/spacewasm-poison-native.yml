name: SpaceWasm rejected-module poison native confirmation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Confirm poisoning and future private-function hijack
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/spacewasm-native"
          cargo test \
            --manifest-path benchmarks/spacewasm-poison/runner/Cargo.toml \
            --release rejected_module_ -- --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/spacewasm-native/poison-and-hijack-tests.log"
          grep -q 'rejected_module_poison_is_observable ... ok' \
            "$RUNNER_TEMP/spacewasm-native/poison-and-hijack-tests.log"
          grep -q 'rejected_module_hijacks_future_private_function ... ok' \
            "$RUNNER_TEMP/spacewasm-native/poison-and-hijack-tests.log"

      - name: Confirm delayed indirect-call crash
        shell: bash
        run: |
          set +e
          cargo test \
            --manifest-path benchmarks/spacewasm-poison/runner/Cargo.toml \
            --release rejected_module_crashes_later_indirect_call \
            -- --ignored --nocapture \
            > "$RUNNER_TEMP/spacewasm-native/delayed-crash.log" 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -q 'index out of bounds: the len is 1 but the index is 1' \
            "$RUNNER_TEMP/spacewasm-native/delayed-crash.log"
          echo "$rc" > "$RUNNER_TEMP/spacewasm-native/delayed-crash.rc"

      - name: Replay the complete six-schedule production state space
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/spacewasm-native/schedules"
          mkdir -p "$out"
          manifest=benchmarks/spacewasm-poison/full-schedule-runner/Cargo.toml

          # Build once so each replay executes the same exact pinned runtime.
          cargo build --manifest-path "$manifest" --release
          bin=benchmarks/spacewasm-poison/full-schedule-runner/target/release/spacewasm_full_schedule_runner
          test -x "$bin"

          capture() {
            local name=$1 e0=$2 e1=$3 e2=$4
            set +e
            "$bin" "$e0" "$e1" "$e2" > "$out/$name.log" 2>&1
            local rc=$?
            set -e
            echo "$rc" > "$out/$name.rc"
          }

          # 0=rejected attacker load, 1=future valid load, 2=provider call.
          capture attack-future-call 0 1 2
          capture attack-call-future 0 2 1
          capture future-attack-call 1 0 2
          capture future-call-attack 1 2 0
          capture call-attack-future 2 0 1
          capture call-future-attack 2 1 0

          # Exactly one schedule resurrects the stale reference into a later
          # private function. Two schedules follow a dangling module index.
          # Three schedules reveal a second temporal failure: imported-table
          # initialization unwraps a non-unique Rc after an earlier invocation.
          test "$(cat "$out/attack-future-call.rc")" -eq 0
          grep -q '^result=1$' "$out/attack-future-call.log"

          test "$(cat "$out/attack-call-future.rc")" -ne 0
          grep -q 'index out of bounds: the len is 1 but the index is 1' \
            "$out/attack-call-future.log"

          test "$(cat "$out/future-attack-call.rc")" -ne 0
          grep -q 'index out of bounds: the len is 2 but the index is 2' \
            "$out/future-attack-call.log"

          for name in future-call-attack call-attack-future call-future-attack; do
            test "$(cat "$out/$name.rc")" -ne 0
            grep -q 'src/module.rs:862' "$out/$name.log"
            grep -q 'Option::unwrap()' "$out/$name.log"
          done

          {
            echo 'Exact production schedule outcomes'
            echo '=================================='
            echo 'attack-future-call: private-function-hijack (result=31337)'
            echo 'attack-call-future: dangling-index-panic (len=1,index=1)'
            echo 'future-attack-call: dangling-index-panic (len=2,index=2)'
            echo 'future-call-attack: shared-table-Rc-panic (module.rs:862)'
            echo 'call-attack-future: shared-table-Rc-panic (module.rs:862)'
            echo 'call-future-attack: shared-table-Rc-panic (module.rs:862)'
            echo
            for f in "$out"/*.rc; do
              printf '%s: rc=%s\n' "$(basename "$f" .rc)" "$(cat "$f")"
            done
          } | tee "$RUNNER_TEMP/spacewasm-native/schedule-results.txt"

      - name: Upload native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spacewasm-poison-native-diagnostics
          path: ${{ runner.temp }}/spacewasm-native
          retention-days: 30
