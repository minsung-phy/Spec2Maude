name: SpaceWasm rejected-module poison native confirmation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run exact pinned SpaceWasm reproduction
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/spacewasm-native"
          cargo test \
            --manifest-path benchmarks/spacewasm-poison/runner/Cargo.toml \
            --release -- --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/spacewasm-native/cargo-test.log"
      - name: Upload native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spacewasm-poison-native-diagnostics
          path: ${{ runner.temp }}/spacewasm-native
          retention-days: 30
