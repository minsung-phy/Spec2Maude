name: Full SpaceWasm persistent-state automatic model checking

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  modelcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3"
          dune-cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wabt
          opam install dune menhir zarith -y
          rustup target add wasm32-unknown-unknown

      - name: Build Spec2Maude
        run: opam exec -- dune build --profile release

      - name: Install Maude and Binaryen
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/maude-lang/Maude/releases/download/Maude3.5.1/Maude-3.5.1-linux-x86_64.zip -o "$RUNNER_TEMP/maude.zip"
          unzip -q "$RUNNER_TEMP/maude.zip" -d "$RUNNER_TEMP/maude"
          maude_bin=$(find "$RUNNER_TEMP/maude" -type f -name maude -perm -u+x | head -n 1)
          echo "MAUDE=$maude_bin" >> "$GITHUB_ENV"
          curl -fL --retry 3 https://github.com/WebAssembly/binaryen/releases/download/version_131/binaryen-version_131-x86_64-linux.tar.gz -o "$RUNNER_TEMP/binaryen.tar.gz"
          mkdir -p "$RUNNER_TEMP/binaryen"
          tar -xzf "$RUNNER_TEMP/binaryen.tar.gz" -C "$RUNNER_TEMP/binaryen" --strip-components=1
          echo "WASM_OPT=$RUNNER_TEMP/binaryen/bin/wasm-opt" >> "$GITHUB_ENV"

      - name: Confirm the issue in pinned native SpaceWasm
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/spacewasm-stateful"
          mkdir -p "$out"
          cargo test \
            --manifest-path benchmarks/spacewasm-poison/full-schedule-runner/Cargo.toml \
            --release attack_then_future_then_call_hijacks_private_function \
            -- --nocapture > "$out/native-control.log" 2>&1
          grep -q 'attack_then_future_then_call_hijacks_private_function ... ok' \
            "$out/native-control.log"

      - name: Compile persistent exact SpaceWasm application to Wasm
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/spacewasm-stateful"
          cargo build \
            --manifest-path benchmarks/spacewasm-poison/full-stateful-runner/Cargo.toml \
            --target wasm32-unknown-unknown --release \
            > "$out/cargo-build.log" 2>&1
          raw=benchmarks/spacewasm-poison/full-stateful-runner/target/wasm32-unknown-unknown/release/spacewasm_full_stateful_runner.wasm
          cp "$raw" "$out/full-raw.wasm"
          "$WASM_OPT" "$raw" \
            --enable-bulk-memory --enable-sign-ext --enable-nontrapping-float-to-int \
            --llvm-memory-copy-fill-lowering --signext-lowering \
            --llvm-nontrapping-fptoint-lowering \
            -O4 --strip-debug --strip-producers -o "$out/full-lowered.wasm"
          "$WASM_OPT" "$out/full-lowered.wasm" --mvp-features -O4 \
            -o "$out/full-optimized.wasm"
          wasm-validate "$out/full-optimized.wasm"
          wasm-objdump -x "$out/full-optimized.wasm" > "$out/full.objdump"
          grep -q 'spacewasm_init' "$out/full.objdump"
          grep -q 'spacewasm_event' "$out/full.objdump"
          grep -q 'spacewasm_bad' "$out/full.objdump"
          stat --printf='optimized_bytes=%s\n' "$out/full-optimized.wasm" | tee "$out/sizes.txt"

      - name: Automatically translate all production entry points
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/spacewasm-stateful"
          opam exec -- dune exec --profile release ./bin/wasm2maude.exe -- run \
            "$out/full-optimized.wasm" --invoke spacewasm_init \
            --steps 1 --semantics builtins.maude -o "$out/init-run.maude" \
            > "$out/wasm2maude-init.log" 2>&1
          opam exec -- dune exec --profile release ./bin/wasm2maude.exe -- run \
            "$out/full-optimized.wasm" --invoke spacewasm_event --arg i32:0 \
            --steps 1 --semantics builtins.maude -o "$out/event-run.maude" \
            > "$out/wasm2maude-event.log" 2>&1
          opam exec -- dune exec --profile release ./bin/wasm2maude.exe -- run \
            "$out/full-optimized.wasm" --invoke spacewasm_bad \
            --steps 1 --semantics builtins.maude -o "$out/bad-run.maude" \
            > "$out/wasm2maude-bad.log" 2>&1

          python3 benchmarks/spacewasm-poison/make_stateful_full_modelcheck_v2.py \
            "$out/init-run.maude" "$out/event-run.maude" "$out/bad-run.maude" \
            "$out/modelcheck.maude"
          grep -q 'initialize-spacewasm' "$out/modelcheck.maude"
          grep -q 'choose-first' "$out/modelcheck.maude"
          grep -q 'ceq runEvent' "$out/modelcheck.maude"

      - name: Model check persistent production state over all schedules
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/spacewasm-stateful"
          set +e
          timeout 6300s "$MAUDE" -no-banner "$out/modelcheck.maude" \
            > "$out/modelcheck.log" 2>&1
          rc=$?
          set -e
          echo "$rc" > "$out/modelcheck.rc"
          test "$rc" -eq 0
          ! grep -Eq '^(Warning|Advisory|Error):' "$out/modelcheck.log"
          grep -q '^Solution 1' "$out/modelcheck.log"
          grep -q 'done(attack, future, call, 1)' "$out/modelcheck.log"

      - name: Summarize evidence
        if: always()
        shell: bash
        run: |
          out="$RUNNER_TEMP/spacewasm-stateful"
          mkdir -p "$out"
          {
            echo 'Full SpaceWasm persistent-state automatic model check'
            echo '===================================================='
            echo "spec2maude_sha=$GITHUB_SHA"
            echo 'spacewasm_sha=839feec79fcd7137e2e5f1a19922127f97d6d1d8'
            test -f "$out/sizes.txt" && cat "$out/sizes.txt"
            echo
            echo '[Model checking]'
            test -f "$out/modelcheck.log" && \
              grep -E '^(Solution 1|state [0-9]+|states:|rewrites:|result RunState:)' \
                "$out/modelcheck.log" || true
            echo
            echo '[Native control]'
            test -f "$out/native-control.log" && \
              grep 'attack_then_future_then_call_hijacks_private_function.*ok' \
                "$out/native-control.log" || true
          } | tee "$out/results.txt"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec2maude-full-spacewasm-persistent-modelcheck
          path: ${{ runner.temp }}/spacewasm-stateful
          retention-days: 30
