name: Spec2Maude distributed chat model check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chat-modelcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out analysis branch
        uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3"
          dune-cache: true

      - name: Install OCaml dependencies
        shell: bash
        run: |
          set -euo pipefail
          opam install dune menhir -y

          # The setup action creates a local opam switch under this repository.
          # Building wasm inside that switch makes modern Dune discover the
          # outer Spec2Maude dune-project instead of wasm's interpreter project.
          # Build it in an external directory and install its Dune package into
          # the active switch, which is equivalent for downstream compilation.
          switch=$(opam switch show)
          prefix=$(opam var prefix --switch "$switch")
          wasm_src="$RUNNER_TEMP/wasm-2.0.2"
          opam source wasm.2.0.2 --dir "$wasm_src"
          (
            cd "$wasm_src/interpreter"
            opam exec --switch "$switch" -- dune build -p wasm @install
            opam exec --switch "$switch" -- dune install --prefix "$prefix" wasm
          )
          test -f "$prefix/lib/wasm/dune-package"

      - name: Build Spec2Maude and wasm2maude
        run: opam exec -- dune build

      - name: Install Maude 3.5.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://github.com/maude-lang/Maude/releases/download/Maude3.5.1/Maude-3.5.1-linux-x86_64.zip \
            -o "$RUNNER_TEMP/maude.zip"
          unzip -q "$RUNNER_TEMP/maude.zip" -d "$RUNNER_TEMP/maude"
          maude_bin=$(find "$RUNNER_TEMP/maude" -type f -name maude -perm -u+x | head -n 1)
          test -n "$maude_bin"
          maude_dir=$(dirname "$maude_bin")
          echo "$maude_dir" >> "$GITHUB_PATH"
          echo "MAUDE=$maude_bin" >> "$GITHUB_ENV"
          "$maude_bin" --version

      - name: Load generated semantics
        run: |
          "$MAUDE" -no-banner output.maude > "$RUNNER_TEMP/output-load.log" 2>&1
          "$MAUDE" -no-banner builtins.maude > "$RUNNER_TEMP/builtins-load.log" 2>&1
          if grep -Eq '^(Warning|Advisory|Error):' "$RUNNER_TEMP/output-load.log" "$RUNNER_TEMP/builtins-load.log"; then
            cat "$RUNNER_TEMP/output-load.log"
            cat "$RUNNER_TEMP/builtins-load.log"
            exit 1
          fi

      - name: Run distributed chat model checking
        run: opam exec -- bash benchmarks/chat/run.sh "$RUNNER_TEMP/spec2maude-chat"

      - name: Collect environment and logs
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/spec2maude-chat"
          cp "$RUNNER_TEMP/output-load.log" "$RUNNER_TEMP/spec2maude-chat/" 2>/dev/null || true
          cp "$RUNNER_TEMP/builtins-load.log" "$RUNNER_TEMP/spec2maude-chat/" 2>/dev/null || true
          {
            echo "github_sha=$GITHUB_SHA"
            echo "runner_os=$RUNNER_OS"
            opam exec -- ocaml -version || true
            opam exec -- dune --version || true
            if [[ -n "${MAUDE:-}" ]]; then "$MAUDE" --version || true; fi
          } > "$RUNNER_TEMP/spec2maude-chat/environment.txt"

      - name: Upload model-checking evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec2maude-chat-modelcheck
          path: ${{ runner.temp }}/spec2maude-chat
          if-no-files-found: warn
          retention-days: 14
