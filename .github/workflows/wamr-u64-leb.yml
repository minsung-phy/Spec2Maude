name: WAMR production u64 LEB model checking

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modelcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out analysis branch
        uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3"
          dune-cache: true

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y wabt cmake ninja-build
          opam install dune menhir zarith -y

      - name: Build Spec2Maude and wasm2maude
        run: opam exec -- dune build --profile release

      - name: Install Maude 3.5.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://github.com/maude-lang/Maude/releases/download/Maude3.5.1/Maude-3.5.1-linux-x86_64.zip \
            -o "$RUNNER_TEMP/maude.zip"
          unzip -q "$RUNNER_TEMP/maude.zip" -d "$RUNNER_TEMP/maude"
          maude_bin=$(find "$RUNNER_TEMP/maude" -type f -name maude -perm -u+x | head -n 1)
          test -n "$maude_bin"
          echo "$(dirname "$maude_bin")" >> "$GITHUB_PATH"
          echo "MAUDE=$maude_bin" >> "$GITHUB_ENV"
          "$maude_bin" --version

      - name: Load generated official semantics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wamr-u64-leb"
          "$MAUDE" -no-banner output.maude \
            > "$RUNNER_TEMP/wamr-u64-leb/output-load.log" 2>&1
          "$MAUDE" -no-banner builtins.maude \
            > "$RUNNER_TEMP/wamr-u64-leb/builtins-load.log" 2>&1
          if grep -Eq '^(Warning|Advisory|Error):' \
              "$RUNNER_TEMP/wamr-u64-leb/output-load.log" \
              "$RUNNER_TEMP/wamr-u64-leb/builtins-load.log"; then
            cat "$RUNNER_TEMP/wamr-u64-leb/output-load.log"
            cat "$RUNNER_TEMP/wamr-u64-leb/builtins-load.log"
            exit 1
          fi

      - name: Model check pinned WAMR production decoder and loader
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('benchmarks/wamr-u64-leb/run.sh')
          text = path.read_text(encoding='utf-8')
          old = '''grep -q 'instr.const(numtype.i32, uN.wrap(0))' \\
            "$out_dir/current-last2.log"
          grep -q 'instr.const(numtype.i32, uN.wrap(2))' \\
            "$out_dir/fixed-last2.log"'''
          new = '''python3 "$bench/check_maude_result.py" \\
            "$out_dir/current-last2.log" 0
          python3 "$bench/check_maude_result.py" \\
            "$out_dir/fixed-last2.log" 2'''
          if text.count(old) != 1:
              raise SystemExit('expected concrete-result check block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          CPATH="$GITHUB_WORKSPACE/benchmarks/wamr-u64-leb/platform-stub" \
            opam exec -- bash benchmarks/wamr-u64-leb/run.sh \
              "$RUNNER_TEMP/wamr-u64-leb"

      - name: Collect runner metadata
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/wamr-u64-leb"
          {
            echo "github_sha=$GITHUB_SHA"
            echo "runner_os=$RUNNER_OS"
            opam exec -- ocaml -version || true
            opam exec -- dune --version || true
            clang --version | head -n 1 || true
            cmake --version | head -n 1 || true
            wasm-validate --version || true
            if [[ -n "${MAUDE:-}" ]]; then "$MAUDE" --version || true; fi
          } > "$RUNNER_TEMP/wamr-u64-leb/environment.txt"

      - name: Upload full evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec2maude-wamr-u64-leb
          path: ${{ runner.temp }}/wamr-u64-leb
          if-no-files-found: warn
          retention-days: 30
