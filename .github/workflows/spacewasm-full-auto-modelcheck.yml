name: Full NASA SpaceWasm automatic model checking

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  modelcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3"
          dune-cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wabt
          opam install dune menhir zarith -y
          rustup target add wasm32-unknown-unknown

      - name: Build Spec2Maude
        run: opam exec -- dune build --profile release

      - name: Install Maude 3.5.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://github.com/maude-lang/Maude/releases/download/Maude3.5.1/Maude-3.5.1-linux-x86_64.zip \
            -o "$RUNNER_TEMP/maude.zip"
          unzip -q "$RUNNER_TEMP/maude.zip" -d "$RUNNER_TEMP/maude"
          maude_bin=$(find "$RUNNER_TEMP/maude" -type f -name maude -perm -u+x | head -n 1)
          test -n "$maude_bin"
          echo "MAUDE=$maude_bin" >> "$GITHUB_ENV"
          "$maude_bin" --version

      - name: Install pinned Binaryen 131
        shell: bash
        run: |
          set -euo pipefail
          url=https://github.com/WebAssembly/binaryen/releases/download/version_131/binaryen-version_131-x86_64-linux.tar.gz
          curl -fL --retry 3 "$url" -o "$RUNNER_TEMP/binaryen.tar.gz"
          echo 'b5bf1f0eaf17c63ee588ff7a5954dc8f6ce2c26989051c66f24dfe9ece3e46db  '"$RUNNER_TEMP/binaryen.tar.gz" \
            | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/binaryen"
          tar -xzf "$RUNNER_TEMP/binaryen.tar.gz" \
            -C "$RUNNER_TEMP/binaryen" --strip-components=1
          echo "WASM_OPT=$RUNNER_TEMP/binaryen/bin/wasm-opt" >> "$GITHUB_ENV"

      - name: Confirm the concrete attack in pinned NASA SpaceWasm
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/spacewasm-full-auto"
          mkdir -p "$out"
          cargo test \
            --manifest-path benchmarks/spacewasm-poison/full-schedule-runner/Cargo.toml \
            --release attack_then_future_then_call_hijacks_private_function \
            -- --nocapture 2>&1 | tee "$out/native-control.log"
          grep -q 'attack_then_future_then_call_hijacks_private_function ... ok' \
            "$out/native-control.log"

      - name: Compile the exact SpaceWasm implementation to Wasm
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/spacewasm-full-auto"
          mkdir -p "$out"
          cargo build \
            --manifest-path benchmarks/spacewasm-poison/full-auto-runner/Cargo.toml \
            --target wasm32-unknown-unknown --release
          raw=benchmarks/spacewasm-poison/full-auto-runner/target/wasm32-unknown-unknown/release/spacewasm_full_auto_runner.wasm
          cp "$raw" "$out/full-raw.wasm"

          "$WASM_OPT" "$raw" \
            --enable-bulk-memory \
            --enable-sign-ext \
            --enable-nontrapping-float-to-int \
            --llvm-memory-copy-fill-lowering \
            --signext-lowering \
            --llvm-nontrapping-fptoint-lowering \
            -O4 --strip-debug --strip-producers \
            -o "$out/full-lowered.wasm"
          "$WASM_OPT" "$out/full-lowered.wasm" --mvp-features -O4 \
            -o "$out/full-optimized.wasm"

          wasm-validate "$out/full-optimized.wasm"
          wasm-objdump -x "$out/full-optimized.wasm" > "$out/full.objdump"
          grep -q 'spacewasm_run3' "$out/full.objdump"
          {
            stat --printf='raw_bytes=%s\n' "$out/full-raw.wasm"
            stat --printf='optimized_bytes=%s\n' "$out/full-optimized.wasm"
          } | tee "$out/sizes.txt"
          sha256sum "$out/full-optimized.wasm" > "$out/full.sha256"

      - name: Automatically translate the full program with Spec2Maude
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/spacewasm-full-auto"
          "$MAUDE" -no-banner output.maude > "$out/output-load.log" 2>&1
          "$MAUDE" -no-banner builtins.maude > "$out/builtins-load.log" 2>&1
          ! grep -Eq '^(Warning|Advisory|Error):' "$out"/*-load.log

          opam exec -- dune exec --profile release ./bin/wasm2maude.exe -- run \
            "$out/full-optimized.wasm" --invoke spacewasm_run3 \
            --arg i32:0 --arg i32:1 --arg i32:2 \
            --steps 1 --semantics builtins.maude \
            -o "$out/translated-raw.maude"
          python3 benchmarks/spacewasm-poison/make_full_auto_modelcheck.py \
            "$out/translated-raw.maude" "$out/modelcheck.maude"
          grep -q 'choose-first' "$out/modelcheck.maude"
          grep -q 'rel.steps(C2)' "$out/modelcheck.maude"

      - name: Search all automatically generated event schedules
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/spacewasm-full-auto"
          set +e
          timeout 6300s "$MAUDE" -no-banner "$out/modelcheck.maude" \
            > "$out/modelcheck.log" 2>&1
          rc=$?
          set -e
          echo "$rc" > "$out/modelcheck.rc"
          if test "$rc" -ne 0; then
            tail -n 200 "$out/modelcheck.log" || true
            exit "$rc"
          fi
          ! grep -Eq '^(Warning|Advisory|Error):' "$out/modelcheck.log"
          grep -q '^Solution 1' "$out/modelcheck.log"
          grep -q 'done(0, 1, 2, 1)' "$out/modelcheck.log"

      - name: Summarize evidence
        if: always()
        shell: bash
        run: |
          out="$RUNNER_TEMP/spacewasm-full-auto"
          mkdir -p "$out"
          {
            echo 'Full NASA SpaceWasm automatic model-checking experiment'
            echo '======================================================'
            echo "spec2maude_sha=$GITHUB_SHA"
            echo 'spacewasm_sha=839feec79fcd7137e2e5f1a19922127f97d6d1d8'
            echo "maude=$($MAUDE --version 2>&1 | head -n 1 || true)"
            test -f "$out/sizes.txt" && cat "$out/sizes.txt"
            echo
            echo '[Search result]'
            test -f "$out/modelcheck.log" && \
              grep -E '^(Solution 1|state [0-9]+|states:|rewrites:|result RunState:)' \
                "$out/modelcheck.log" || true
            echo
            echo '[Concrete production control]'
            test -f "$out/native-control.log" && \
              grep 'attack_then_future_then_call_hijacks_private_function.*ok' \
                "$out/native-control.log" || true
          } | tee "$out/results.txt"

      - name: Upload all evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec2maude-full-spacewasm-auto-modelcheck
          path: ${{ runner.temp }}/spacewasm-full-auto
          retention-days: 30
